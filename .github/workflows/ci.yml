name: CI
on:
  pull_request:
  push:
    branches: [main]
 
permissions:
  contents: read
 
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests with coverage
        run: pytest --cov=library --cov-report=term --cov-fail-under=80
